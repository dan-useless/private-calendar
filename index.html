<!DOCTYPE html>
<html>
<head>
  <title>Command Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="login-container" class="login-wrapper">
  <div class="login-card">
    <h2>Command Center</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Enter</button>
    <p id="login-error"></p>
  </div>
</div>

<div id="app-container" style="display:none;">
  <div class="layout">

    <!-- LEFT PANEL -->
    <div class="panel left">
      <h3 id="selected-date-title">Select a date</h3>

      <div class="task-section">
        <h4>Today</h4>
        <div id="today-tasks"></div>
      </div>

      <div class="task-section">
        <h4 class="carry">Carried Forward</h4>
        <div id="carry-tasks"></div>
      </div>

      <div class="task-section">
        <h4 class="completed">Completed</h4>
        <div id="completed-tasks"></div>
      </div>
    </div>

    <!-- CENTER PANEL -->
    <div class="panel center">
      <div id="calendar"></div>
      <div id="analytics-note" class="analytics-note"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="panel right">
      <h3>Create Task</h3>

      <div class="create-card">
        <input type="text" id="task-title" placeholder="Title">
        <textarea id="task-desc" placeholder="Description"></textarea>
        <button onclick="createTask()">Create Task</button>
      </div>
    </div>

  </div>
</div>

<!-- MODAL -->
<div id="delete-modal" class="modal">
  <div class="modal-content">
    <p>Delete this task permanently?</p>
    <button onclick="confirmDelete()">Delete</button>
    <button onclick="closeModal()">Cancel</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
