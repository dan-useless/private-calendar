<!DOCTYPE html>
<html>
<head>
  <title>Private Calendar</title>

  <link rel="stylesheet" href="style.css">

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>

<body>

<!-- LOGIN CARD -->
<div id="login-container" class="center-container">
  <div class="card">
    <h2>Private Calendar</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <p id="login-error" class="error"></p>
  </div>
</div>

<!-- APP -->
<div id="app-container" style="display:none;">
  <div class="header">
    <h2>📅 Private Task Calendar</h2>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="main-layout">
    <div class="calendar-box">
      <div id="calendar"></div>
    </div>

    <div class="task-box">
      <h3 id="selected-date-title">Select a date</h3>

      <div class="task-input">
        <input type="text" id="new-task" placeholder="Enter task...">
        <button onclick="addTask()">Add</button>
      </div>

      <ul id="task-list"></ul>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
