<!DOCTYPE html>
<html>
<head>
  <title>Private Command Center</title>
  <link rel="stylesheet" href="style.css">

  <!-- FullCalendar -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>

  <!-- SortableJS -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

  <!-- Firebase v8 -->
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>

<body>

<div id="login-container" class="center">
  <div class="glass-card">
    <h2>Private Command Center</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Enter</button>
    <p id="login-error"></p>
  </div>
</div>

<div id="app-container" style="display:none;">

  <div class="layout">

    <!-- LEFT PANEL -->
    <div class="panel left-panel">
      <h3 id="selected-date-title"></h3>

      <div class="section-title">Today</div>
      <div id="today-tasks" class="task-container"></div>

      <div class="section-title carry">Carried Forward</div>
      <div id="carry-tasks" class="task-container"></div>

      <div class="section-title completed">Completed</div>
      <div id="completed-tasks" class="task-container completed-zone"></div>
    </div>

    <!-- CENTER PANEL -->
    <div class="panel center-panel">
      <div id="calendar"></div>
      <div id="analytics-note" class="analytics-note hidden"></div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="panel right-panel">
      <h3>Create Task</h3>
      <input type="text" id="task-title" placeholder="Task Title">
      <textarea id="task-desc" placeholder="Task Description"></textarea>
      <button class="create-btn" onclick="createTask()">Create Task</button>
    </div>

  </div>

</div>

<div id="delete-modal" class="modal hidden">
  <div class="modal-content">
    <p>Are you sure you want to delete this task?</p>
    <div class="modal-actions">
      <button onclick="confirmDelete()">Yes</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
